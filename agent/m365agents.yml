# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.8/yaml.schema.json
# Microsoft 365 Agents Toolkit (≥ 6.12) project for the Collections declarative agent.
# VERIFY: let the toolkit upgrade this file's schema version if it offers to.
version: v1.8

environmentFolderPath: ./env

provision:
  # Registers the app in the Teams Developer Portal.
  - uses: teamsApp/create
    with:
      name: Collections${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # Optional, OAuth 2.1 instead of Entra SSO: let the toolkit register the client.
  # Fill MCP_AUTH_REFERENCE_ID by hand instead when you use an Entra SSO registration.
  # - uses: oauth/register
  #   with:
  #     name: collectionsMcpAuth
  #     flow: authorizationCode
  #     appId: ${{TEAMS_APP_ID}}
  #     clientId: ${{MCP_OAUTH_CLIENT_ID}}
  #     clientSecret: ${{SECRET_MCP_OAUTH_CLIENT_SECRET}}
  #     apiSpecPath: ./appPackage/ai-plugin.json
  #   writeToEnvironmentFile:
  #     configurationId: MCP_AUTH_REFERENCE_ID

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Makes the agent available in Microsoft 365 Copilot; the title id is what the app targets.
  - uses: teamsApp/extendToM365
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID

publish:
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    writeToEnvironmentFile:
      publishedAppId: TEAMS_APP_PUBLISHED_APP_ID
